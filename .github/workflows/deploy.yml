# Checks, image, deploy. Every push to main that passes the web checks becomes
# the running revision on Azure Container Apps. The one-time setup this relies
# on (the container app, the federated credential, the three secrets, the Clerk
# variable) is in docs/deploy.md.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A second push waits for the first deploy to finish instead of racing it.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/mofadel26/enjazi-core
  # Must match RESOURCE_GROUP and APP_NAME in infra/deploy.sh.
  RESOURCE_GROUP: enjazi-core-rg
  APP_NAME: enjazi-core

jobs:
  web-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Enjazi.Web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Enjazi.Web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

  image:
    needs: [web-checks]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          # Public, so a repository variable rather than a secret (ADR-0015).
          build-args: VITE_CLERK_PUBLISHABLE_KEY=${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets azure/login exchange a GitHub-issued token for an Azure one
      # through the federated credential. No Azure password is stored.
      id-token: write
    steps:
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - run: |
          az extension add --name containerapp --upgrade --only-show-errors
          az containerapp update \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE:$GITHUB_SHA"
