# Tests, image, deploy. Every push to main that passes the tests becomes the
# running revision on Azure Container Apps. The one-time setup this relies on
# (the container app, the federated credential, the four secrets, the Clerk
# variable) is in docs/deploy.md.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A second push waits for the first deploy to finish instead of racing it.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/mofadel26/enjazi-core
  # Must match RESOURCE_GROUP and APP_NAME in infra/deploy.sh.
  RESOURCE_GROUP: enjazi-core-rg
  APP_NAME: enjazi-core

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      # The test project is its own runner and starts Postgres with
      # Testcontainers; scripts/verify-phase-2.sh explains why not dotnet test.
      - run: dotnet run --project tests/Enjazi.Api.Tests

  # The browser suite against the real API and a real database, signing in
  # through the Clerk development instance (docs/development.md, "Tests").
  e2e:
    runs-on: ubuntu-latest
    # Matches the connection string in appsettings.Development.json.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fadel
          POSTGRES_DB: enjazi_core
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fadel -d enjazi_core"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Enjazi.Web/package-lock.json
      - run: npm ci
        working-directory: src/Enjazi.Web
      - run: npx playwright install --with-deps chromium
        working-directory: src/Enjazi.Web
      # Settings on the command line, not in the environment, for the reason
      # in scripts/verify-phase-5.sh. The guest tests need a signing key; a
      # throwaway one per run will do. The process outlives this step.
      - name: Start the API
        run: |
          dotnet build src/Enjazi.Api
          dotnet run --no-build --project src/Enjazi.Api -- \
            --Bootstrap:AdminEmail=phase5-admin+clerk_test@example.com \
            --Guest:SigningKey="$(openssl rand -base64 48)" \
            --Database:MigrateOnStartup=true > "$RUNNER_TEMP/api.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl -s -o /dev/null http://127.0.0.1:5180/api/auth/me && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/api.log"
          exit 1
      - run: npm run e2e
        working-directory: src/Enjazi.Web
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}

  web-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Enjazi.Web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Enjazi.Web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

  image:
    needs: [api-tests, e2e, web-checks]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          # Public, so a repository variable rather than a secret (ADR-0015).
          build-args: VITE_CLERK_PUBLISHABLE_KEY=${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets azure/login exchange a GitHub-issued token for an Azure one
      # through the federated credential. No Azure password is stored.
      id-token: write
    steps:
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - run: |
          az extension add --name containerapp --upgrade --only-show-errors
          az containerapp update \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE:$GITHUB_SHA"
